<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FPVSIM — game models</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #12140f;
        --panel: #1a1d16;
        --line: #2c3126;
        --ink: #c8d0bd;
        --dim: #7e8874;
        --accent: #9fd356;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        height: 100vh;
        display: grid;
        grid-template-columns: 240px 1fr;
      }
      aside {
        border-right: 1px solid var(--line);
        overflow-y: auto;
        padding: 12px 0 40px;
      }
      aside h1 { font-size: 13px; margin: 0 12px 12px; letter-spacing: .08em; text-transform: uppercase; }
      .grouphead { color: var(--dim); font-size: 11px; padding: 12px 12px 4px; text-transform: uppercase; letter-spacing: .1em; }
      .item {
        display: flex; justify-content: space-between; gap: 8px;
        padding: 6px 12px; cursor: pointer; border-left: 2px solid transparent;
      }
      .item:hover { background: #1e2219; }
      .item.active { background: #232819; border-left-color: var(--accent); color: #fff; }
      .item .badge { color: var(--dim); font-size: 11px; }
      .item.done .badge { color: var(--accent); }
      main { display: flex; flex-direction: column; overflow: hidden; }
      header {
        display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
        padding: 12px 16px; border-bottom: 1px solid var(--line);
      }
      header h2 { margin: 0; font-size: 15px; }
      header .note { color: var(--dim); }
      header .spacer { flex: 1; }
      button {
        background: #232819; color: var(--ink); border: 1px solid var(--line);
        padding: 5px 10px; cursor: pointer; font: inherit; border-radius: 3px;
      }
      button:hover { border-color: var(--accent); color: #fff; }
      button.on { border-color: var(--accent); color: var(--accent); }
      .cards { flex: 1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px 16px; min-height: 0; }
      .card {
        border: 1px solid var(--line); border-radius: 4px; overflow: hidden;
        display: flex; flex-direction: column; background: var(--panel); cursor: pointer;
        transition: border-color .12s;
      }
      .card:hover { border-color: #4a5340; }
      .card.picked { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
      .card canvas { flex: 1; width: 100%; display: block; min-height: 0; }
      .card .bar { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-top: 1px solid var(--line); }
      .card .bar .key { color: var(--dim); }
      .card.picked .bar .tick { color: var(--accent); }
      .card .bar .tick { color: #3b4133; font-size: 15px; }
      .card .hint { color: var(--dim); font-size: 11px; padding: 0 10px 8px; }
      footer {
        display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
        padding: 10px 16px; border-top: 1px solid var(--line); color: var(--dim);
      }
      code { color: var(--accent); }
      dialog {
        background: var(--panel); color: var(--ink); border: 1px solid var(--accent);
        border-radius: 4px; max-width: 720px; width: 90vw;
      }
      dialog::backdrop { background: #000b; }
      textarea {
        width: 100%; height: 46vh; background: #0e100c; color: var(--ink);
        border: 1px solid var(--line); font: inherit; padding: 8px; resize: vertical;
      }
    </style>
  </head>
  <body>
    <aside>
      <h1>Game models</h1>
      <div id="list"></div>
    </aside>

    <main>
      <header>
        <h2 id="title">—</h2>
        <span class="note" id="dims"></span>
        <span class="note" id="note"></span>
        <span class="spacer"></span>
        <button id="spin" class="on">Spin</button>
        <button id="view">View: orbit</button>
        <button id="reset">Reset cam</button>
      </header>

      <div class="cards" id="cards"></div>

      <footer>
        <span><code>←/→</code> object · <code>drag</code> rotate · <code>wheel</code> zoom · <code>f</code> game view · <code>space</code> spin</span>
      </footer>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
